services:
  - type: web
    name: tradex
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEFAULT_MARKET_PROVIDER
        value: yfinance
      - key: LOG_LEVEL
        value: INFO

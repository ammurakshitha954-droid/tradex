services:
  - type: web
    name: adaptive-trading-system
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEFAULT_MARKET_PROVIDER
        value: yfinance
      - key: LOG_LEVEL
        value: INFO
